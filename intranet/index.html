<!doctype html>
<html lang="en">
<head>
<script>if(/type=recovery/.test(location.hash)&&!location.pathname.startsWith("/reset"))location.replace("/reset/"+location.hash)</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kukpo One">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/intranet/manifest.webmanifest">
<link rel="apple-touch-icon" href="/intranet/apple-touch-icon.png">
<title>Kukpo One</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1A2E'/%3E%3Cpath d='M20 16v32M20 32l16-16M26 27l14 21' stroke='%23C9A55C' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --side:#0B1A2E;--side2:#13263F;--side-t:#AEBBCD;--gold:#C9A55C;--gold-d:#A8853E;
  --bg:#F3F5F8;--card:#fff;--line:#E3E7ED;--soft:#F0F2F6;--ink:#0F1B2D;--body:#334155;--muted:#66758A;
  --acc:#1D4ED8;--acc-d:#1E40AF;--acc-bg:#EEF3FF;--ok:#067647;--ok-bg:#ECFDF3;--bad:#B42318;--bad-bg:#FEF3F2;--warn:#93370D;--warn-bg:#FFFAEB;
  --r:12px;--sh:0 1px 2px rgba(15,27,45,.04),0 1px 3px rgba(15,27,45,.06)
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;word-break:keep-all;font-family:Inter,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.lg-brand{background:var(--side);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.lg-brand:after{content:"";position:absolute;right:-160px;bottom:-160px;width:480px;height:480px;border-radius:50%;border:60px solid rgba(201,165,92,.08)}
.lg-brand .mk{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.14em;font-size:13px}
.lg-brand h1{font-size:40px;line-height:1.15;margin:0 0 16px;font-weight:700;max-width:440px}
.lg-brand h1 em{font-style:normal;color:var(--gold)}
.lg-brand p{color:var(--side-t);max-width:420px;line-height:1.6;margin:0}
.lg-brand .cos{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.lg-brand .cos span{font-size:12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;color:#D6DEE9}
.lg-brand small{color:#6E7F96;font-size:12px}
.lg-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:#fff}
.lg-form form{width:100%;max-width:380px}
.lg-form h2{font-size:24px;margin:0 0 6px}
.lg-form .sub{color:var(--muted);margin:0 0 28px}
.lang-sw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-sw button{border:0;background:#fff;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.lang-sw button.on{background:var(--ink);color:#fff}
.side .lang-sw{border-color:#2A3F5C}.side .lang-sw button{background:transparent;color:var(--side-t)}.side .lang-sw button.on{background:var(--gold);color:var(--side)}

/* form bits */
label{display:block;font-size:13px;font-weight:500;color:var(--body);margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;height:42px;border:1px solid #CDD5DF;border-radius:9px;padding:0 12px;background:#fff;outline:none;transition:border .12s,box-shadow .12s}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
.fld{margin-bottom:14px}
.btn{height:40px;padding:0 16px;border-radius:9px;border:1px solid transparent;background:var(--acc);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;font-size:14px}
.btn:hover{background:var(--acc-d)}
.btn.sec{background:#fff;color:var(--ink);border-color:#CDD5DF}.btn.sec:hover{background:var(--soft)}
.btn.ghost{background:transparent;color:var(--body);border-color:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F4C7C2}.btn.danger:hover{background:var(--bad-bg)}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#05603A}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);cursor:pointer;font-weight:500}

/* shell */
#app{display:flex;min-height:100vh}
.side{width:248px;background:var(--side);color:var(--side-t);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.side .brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;color:#fff}
.side .brand b{font-size:15px;letter-spacing:.02em}.side .brand small{display:block;font-size:11px;color:#7F90A8;letter-spacing:.12em;font-weight:600}
.side nav{flex:1;overflow-y:auto;padding:6px 12px}
.side .grp{font-size:11px;letter-spacing:.12em;font-weight:600;color:#5F718B;padding:16px 10px 6px}
.side nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--side-t);font-weight:500;cursor:pointer;text-decoration:none;margin-bottom:2px}
.side nav a:hover{background:var(--side2);color:#fff}
.side nav a.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.side nav a .bdg{margin-left:auto}
.bdg{background:#E5484D;color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.side .foot{padding:14px 16px;border-top:1px solid #1C3150}
.me{display:flex;align-items:center;gap:10px;margin-top:12px}
.me .nm{color:#fff;font-weight:600;font-size:13px;line-height:1.2}.me .rl{font-size:11px;color:#7F90A8}
.me .out{margin-left:auto;background:none;border:0;color:#7F90A8;cursor:pointer;padding:6px;border-radius:6px}.me .out:hover{color:#fff;background:var(--side2)}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:30}
.top h1{font-size:18px;margin:0;font-weight:600;white-space:nowrap}
.top .burger{display:none;background:none;border:0;padding:6px;cursor:pointer;border-radius:8px}
.search{flex:1;max-width:440px;margin-left:auto;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:0 12px 0 36px;outline:none}
.search input:focus{background:#fff;border-color:var(--acc)}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.scope{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;max-width:220px}
.content{padding:28px;max-width:1320px;width:100%;margin:0 auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card .hd h3{margin:0;font-size:15px;font-weight:600}
.card .hd .sp{flex:1}
.card .bd{padding:18px 20px}
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s2{grid-column:span 2}
.hero{background:linear-gradient(120deg,#0B1A2E 0%,#16304F 100%);color:#fff;border-radius:var(--r);padding:28px 32px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-80px;top:-120px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(201,165,92,.12)}
.hero .dt{font-size:12px;letter-spacing:.12em;color:var(--gold);font-weight:600;text-transform:uppercase}
.hero h2{margin:8px 0 6px;font-size:28px;font-weight:700}
.hero p{margin:0;color:#B9C6D8}
.hero .acts{display:flex;gap:10px;position:relative;z-index:1;flex-wrap:wrap}
.hero .btn.sec{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}.hero .btn.sec:hover{background:rgba(255,255,255,.16)}
.hero .btn.gold{background:var(--gold);color:var(--side)}.hero .btn.gold:hover{background:#D9B76E}
.kpi{padding:18px 20px;display:flex;gap:14px;align-items:center;cursor:pointer}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .v{font-size:26px;font-weight:700;line-height:1}.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.list .it{display:flex;gap:14px;padding:14px 20px;border-top:1px solid var(--soft);align-items:flex-start}
.list .it:first-child{border-top:0}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--body);white-space:nowrap}
.tag .dot{width:7px;height:7px;border-radius:50%}
.tag.pending{background:var(--warn-bg);color:var(--warn)}.tag.approved{background:var(--ok-bg);color:var(--ok)}.tag.rejected{background:var(--bad-bg);color:var(--bad)}
.tag.pin{background:#FFF4DB;color:#8A5A00}
.tag.role-owner{background:#0B1A2E;color:var(--gold)}.tag.role-manager{background:var(--acc-bg);color:var(--acc)}
.muted{color:var(--muted)}.small{font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:18px}
.av.sm{width:28px;height:28px;font-size:11px}
.post h4{margin:0 0 4px;font-size:15px}
.post .meta{font-size:12px;color:var(--muted)}
.post .txt{margin-top:8px;color:var(--body);line-height:1.65;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.cal-day{width:48px;text-align:center;flex-shrink:0;border:1px solid var(--line);border-radius:10px;padding:6px 0;background:#fff}
.cal-day .m{font-size:11px;font-weight:700;color:var(--bad);text-transform:uppercase}.cal-day .d{font-size:20px;font-weight:700;line-height:1.1}
.qlink{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
.qlink:hover{border-color:#B8C4D6;text-decoration:none;box-shadow:var(--sh)}
.qlink .ic{width:36px;height:36px;border-radius:9px;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center}
.qlink b{display:block;font-weight:600}.qlink small{color:var(--muted)}
table.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 16px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:12px 16px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tbw{overflow-x:auto}
.pc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px;gap:4px}
.pc b{font-size:15px;margin-top:8px}.pc .t{color:var(--muted);font-size:13px}
.pc .acts{display:flex;gap:6px;margin-top:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--body)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .h{padding:10px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
.cal .c{min-height:104px;border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:6px;font-size:12px}
.cal .c:nth-child(7n){border-right:0}
.cal .c .n{font-weight:600;color:var(--body);margin-bottom:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal .c.out .n{color:#B6C0CD}
.cal .c.today .n{background:var(--acc);color:#fff}
.cal .ev{display:block;font-size:11px;padding:2px 6px;border-radius:5px;margin-bottom:3px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}

/* chat */
.chat{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 64px - 56px);min-height:480px;overflow:hidden}
.chl{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.chl .hd{padding:14px 16px}
.chl .sc{flex:1;overflow-y:auto;padding:6px 8px 12px}
.chl .grp{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted);padding:12px 10px 6px;text-transform:uppercase}
.chi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--body)}
.chi:hover{background:var(--soft)}
.chi.on{background:var(--acc-bg);color:var(--acc)}
.chi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chi.unread .nm{font-weight:700;color:var(--ink)}
.hash{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.chm{display:flex;flex-direction:column;min-width:0;min-height:0}
.chm .hd{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.chm .hd b{font-size:15px}
.phi{background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:500;padding:8px 20px;border-bottom:1px solid #F7E3B5;display:flex;gap:8px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:2px;background:#FBFCFD}
.dsep{text-align:center;margin:14px 0 8px;font-size:12px;color:var(--muted);font-weight:600}
.dsep span{background:#FBFCFD;padding:0 10px;position:relative}
.dsep:before{content:"";display:block;border-top:1px solid var(--line);position:relative;top:9px}
.msg{display:flex;gap:10px;padding:6px 8px;border-radius:8px;position:relative}
.msg:hover{background:#F2F5F9}
.msg .bx{min-width:0;flex:1}
.msg .who{font-weight:600;font-size:13px}.msg .who small{font-weight:400;color:var(--muted);margin-left:6px}
.msg .tx{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;line-height:1.55;color:var(--body);margin-top:2px}
.trn{font-size:12px;color:var(--muted);margin-top:4px}.trn .linkbtn{font-size:12px}
.msg.cont{padding-top:1px}.msg.cont .av{visibility:hidden;height:0}
.msg .del{position:absolute;right:8px;top:6px;display:none;background:#fff;border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:2px 6px;color:var(--muted);font-size:12px}
.msg:hover .del{display:block}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;margin-top:6px;cursor:pointer;color:var(--ink);max-width:100%}
.file:hover{border-color:#B8C4D6}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imgp{display:block;max-width:280px;max-height:220px;border-radius:9px;margin-top:6px;border:1px solid var(--line);cursor:pointer}
.comp{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;background:#fff}
.comp textarea{flex:1;min-height:42px;max-height:160px;height:42px;border:1px solid #CDD5DF;border-radius:10px;padding:10px 12px;resize:none;outline:none;line-height:1.4}
.comp textarea:focus{border-color:var(--acc)}
.comp .att{background:none;border:1px solid #CDD5DF;border-radius:10px;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.comp .send{width:42px;height:42px;padding:0;flex-shrink:0}
.ro{padding:14px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;background:#fff}
.pend{font-size:12px;color:var(--muted);padding:0 16px 8px;background:#fff}
.back{display:none}

/* modal + toast */
.mbg{position:fixed;inset:0;background:rgba(11,26,46,.5);display:flex;align-items:flex-start;justify-content:center;padding:8vh 14px;z-index:60;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 50px rgba(11,26,46,.25)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh h3{margin:0;font-size:17px;flex:1}
.modal .mb{padding:20px 22px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--soft);border-radius:0 0 14px 14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:80;font-size:14px;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.scrim{display:none}
.gate{max-width:520px;margin:12vh auto;padding:0 16px;text-align:center}
.gate .card{padding:32px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.s2{grid-column:auto}}
@media (max-width:860px){
  #login{grid-template-columns:1fr}.lg-brand{padding:32px 24px;min-height:auto}.lg-brand h1{font-size:28px}.lg-brand .cos,.lg-brand small{display:none}
  .side{transform:translateX(-100%)}.side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .main{margin-left:0}.top{padding:0 14px;gap:10px}.top .burger{display:flex}
  .top h1{font-size:16px}.search{display:none}.scope{max-width:150px}
  .content{padding:16px}
  .g3,.g2{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr;height:calc(100vh - 64px - 32px)}
  .chat.sel .chl{display:none}.chat:not(.sel) .chm{display:none}
  .back{display:inline-flex}
  .hero{padding:22px}.hero h2{font-size:22px}
  .f2{grid-template-columns:1fr}
  .cal .c{min-height:64px;padding:3px}.cal .ev{font-size:10px;padding:1px 3px}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi{padding:14px}.kpi .ic{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="hidden">
  <div class="lg-brand">
    <div class="mk"><span id="lgLogo"></span>KUKPO HOLDINGS</div>
    <div>
      <h1 data-t="lgHead"></h1>
      <p data-t="lgSub"></p>

/* ---------- auth ---------- */
function setLoginMode(m){LOGIN_MODE=m;if(!$('#lBtn'))return;
  $('#lgTitle').textContent=t(m==='in'?'signIn':'createAcct');$('#lgSubT').textContent=t(m==='in'?'signInSub':'createSub');
  $('#lBtn').textContent=t(m==='in'?'signIn':'createAcct');$('#lMode').textContent=t(m==='in'?'firstTime':'haveAcct');
  $('#lPw').autocomplete=m==='in'?'current-password':'new-password'}
$('#lMode').onclick=()=>{$('#lErr').textContent='';setLoginMode(LOGIN_MODE==='in'?'up':'in')};
$('#loginForm').onsubmit=async e=>{e.preventDefault();const er=$('#lErr');er.textContent='';
  const em=$('#lEmail').value.trim().toLowerCase(),pw=$('#lPw').value;
  if(!em||pw.length<8){er.textContent=t('pwShort');return}
  $('#lBtn').disabled=true;
  try{
    if(LOGIN_MODE==='in'){const{error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error){er.textContent=t('badLogin');return}}
    else{const{data,error}=await SB.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+'/intranet/'}});
      if(error){er.textContent=/registered/i.test(error.message)?t('already'):error.message;return}
      if(!data.session){er.style.color='var(--ok)';er.textContent=t('checkMail');return}}
    boot();
  }finally{$('#lBtn').disabled=false}};
async function signOut(){
  if(RT)SB.removeChannel(RT);
  /* stop this device from receiving the signed-out person's notifications */
  try{if(PUSH_SUB){await SB.from('itn_push_subs').delete().eq('endpoint',PUSH_SUB.endpoint);await PUSH_SUB.unsubscribe()}}catch(e){}
  await SB.auth.signOut();location.reload()}
$('#outBtn').onclick=signOut;$('#gateOut').onclick=signOut;

async function boot(){
  const{data:{session}}=await SB.auth.getSession();
  ['#login','#gate','#app'].forEach(s=>$(s).classList.add('hidden'));
  if(!session){$('#login').classList.remove('hidden');return}
  const email=(session.user.email||'').toLowerCase();
  const{data:role,error}=await SB.rpc('itn_me_role');
  if(error||!role){$('#gateEmail').textContent=email;$('#gate').classList.remove('hidden');return}
  const{data:co}=await SB.rpc('itn_me_company');
  ME={email,role,company:co||null};
  await loadBase();
  $('#app').classList.remove('hidden');
  $('#sbLogo').innerHTML=LOGO;
  $('#meAv').innerHTML=avatar(email,'sm');$('#meName').textContent=nameOf(email);
  renderNav();renderScope();
  const h=location.hash.replace('#','');if(h&&NAV.some(n=>n.k===h))VIEW=h;
  const chq=new URLSearchParams(location.search).get('ch');if(chq&&CHANNELS.some(c=>c.id===chq)){CUR_CH=chq;VIEW='chat';history.replaceState(null,'','/intranet/#chat')}
  render();subscribe();initPush();
}
async function loadBase(){
  const[c,m,ch,u]=await Promise.all([
    SB.from('itn_companies').select('*').order('sort'),
    SB.from('itn_members').select('*').order('name'),
    SB.from('itn_channels').select('*'),
    SB.rpc('itn_unread')]);
  COS=c.data||[];MEMBERS=m.data||[];CHANNELS=ch.data||[];
  UNREAD={};(u.data||[]).forEach(r=>UNREAD[r.channel_id]=Number(r.n));
  $('#meRole').textContent=t(ME.role==='staff'?'staffR':ME.role)+(ME.company?' · '+coName(ME.company):'');
}

/* ---------- nav ---------- */
const NAV=[{k:'home'},{k:'news'},{k:'chat'},{k:'time'},{k:'people'},{k:'calendar'},{k:'docs'},{k:'requests'},{k:'admin',owner:true}];
function totalUnread(){return Object.values(UNREAD).reduce((a,b)=>a+b,0)}
function renderNav(){
  const u=totalUnread();
  let h=`<div class="grp">${t('g_main')}</div>`;
  NAV.filter(n=>!n.owner).forEach(n=>h+=`<a data-v="${n.k}" class="${VIEW===n.k?'on':''}">${ic(n.k)}<span>${navT(n.k)}</span>${n.k==='chat'&&u?`<span class="bdg">${u>99?'99+':u}</span>`:''}</a>`);
  if(isOwner())h+=`<div class="grp">${t('g_admin')}</div><a data-v="admin" class="${VIEW==='admin'?'on':''}">${ic('admin')}<span>${t('admin')}</span></a>`;
  $('#nav').innerHTML=h;
  $$('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.v));
  document.title=(u?`(${u}) `:'')+'Kukpo One';
}
function renderScope(){
  const s=$('#scope');
  if(!isOwner()){s.classList.add('hidden');SCOPE=ME.company||'';return}
  s.classList.remove('hidden');
  s.innerHTML=`<option value="">${t('allCos')}</option>`+COS.map(c=>`<option value="${esc(c.id)}">${esc(LANG==='ko'?c.name_ko:c.name_en)}</option>`).join('');
  s.value=SCOPE;s.onchange=()=>{SCOPE=s.value;if(VIEW!=='chat')render()};
}
function go(v){VIEW=v;history.replaceState(null,'','#'+v);closeSide();renderNav();render()}
$('#burger').onclick=()=>{$('#side').classList.add('open');$('#scrim').classList.add('open')};
function closeSide(){$('#side').classList.remove('open');$('#scrim').classList.remove('open')}
$('#scrim').onclick=closeSide;
let qT;$('#q').oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>{if($('#q').value.trim())renderSearch();else render()},200)};

/* scope filter: owner scope '' = everything; company scope shows that company + company-wide */
const inScope=c=>!SCOPE||!c||c===SCOPE;
function render(){
  $('#pgTitle').textContent=navT(VIEW);
  const v=$('#view');v.style.padding='';v.style.maxWidth='';
  ({home:vHome,news:vNews,chat:vChat,people:vPeople,calendar:vCal,docs:vDocs,requests:vReq,admin:vAdmin,time:vTime}[VIEW]||vHome)(v);
}

/* ---------- modal ---------- */
function modal(title,body,onSave,saveLabel){
  const bg=document.createElement('div');bg.className='mbg';
  bg.innerHTML=`<div class="modal"><div class="mh"><h3>${esc(title)}</h3><button class="btn ghost sm" data-x>✕</button></div><form><div class="mb">${body}</div><div class="mf"><button type="button" class="btn sec" data-x>${t('cancel')}</button>${onSave?`<button class="btn">${esc(saveLabel||t('save'))}</button>`:''}</div></form></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.querySelectorAll('[data-x]').forEach(b=>b.onclick=close);
  bg.onclick=e=>{if(e.target===bg)close()};
  bg.querySelector('form').onsubmit=async e=>{e.preventDefault();if(!onSave)return;const b=bg.querySelector('.mf .btn:not(.sec)');b.disabled=true;
    try{const r=await onSave(bg);if(r!==false)close()}catch(err){fail(err)}finally{b.disabled=false}};
  const f=bg.querySelector('input,textarea,select');if(f)f.focus();
  return bg;
}
function coOptions(sel,allowAll){
  const opts=[];
  if(isOwner()){if(allowAll)opts.push(`<option value="">${esc(t('companyWide'))}</option>`);COS.forEach(c=>opts.push(`<option value="${esc(c.id)}" ${sel===c.id?'selected':''}>${esc(LANG==='ko'?c.name_ko:c.name_en)}</option>`))}
  else if(ME.company)opts.push(`<option value="${esc(ME.company)}">${esc(coName(ME.company))}</option>`);
  return opts.join('');
}
const canCreate=()=>isOwner()||(isMgr()&&ME.company);

function kpi(k,bg,fg,val,lab,goto){return `<div class="card kpi" data-go="${goto||(k==='people'?'people':k)}"><div class="ic" style="background:${bg};color:${fg}">${ic(k)}</div><div><div class="v">${val}</div><div class="l">${esc(lab)}</div></div></div>`}
function bindGo(v){v.querySelectorAll('button[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
/* auto-translation: show the reader's language; original is one tap away */
const SHOW_ORIG=new Set();
const hasTr=x=>!!(x&&x.src_lang&&x.src_lang!==LANG&&(x.body_tr||x.title_tr));
const useTr=(x,own)=>hasTr(x)&&!own&&!SHOW_ORIG.has(x.id);
function trNote(x,own){if(!hasTr(x)||own)return'';const on=!SHOW_ORIG.has(x.id);
  return `<div class="trn">🌐 ${on?esc(t('trFrom')(x.src_lang))+' · ':''}<button class="linkbtn" data-tr="${x.id}">${esc(t(on?'seeOrig':'seeTr'))}</button></div>`}
function bindTr(root,redraw){root.querySelectorAll('[data-tr]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.tr;SHOW_ORIG.has(id)?SHOW_ORIG.delete(id):SHOW_ORIG.add(id);redraw()})}
const pTitle=x=>useTr(x,x.author_email===ME.email)&&x.title_tr?x.title_tr:x.title;
const pBody=x=>useTr(x,x.author_email===ME.email)&&x.body_tr?x.body_tr:(x.body||'');
function postItem(x){return `<div class="it post">${avatar(x.author_email)}<div style="flex:1;min-width:0"><div class="row" style="gap:8px">${x.pinned?`<span class="tag pin">📌</span>`:''}<h4>${esc(pTitle(x))}</h4></div>
  <div class="meta">${esc(nameOf(x.author_email))} · ${esc(fmtDT(x.created_at))} · ${esc(coName(x.company_id))}</div>
  <div class="txt" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${linkify(pBody(x))}</div>${trNote(x,x.author_email===ME.email)}</div></div>`}
function evItem(x){const d=dOnly(x.starts_on);return `<div class="it"><div class="cal-day"><div class="m">${esc(d.toLocaleDateString(LOC(),{month:'short'}))}</div><div class="d">${d.getDate()}</div></div>
  <div style="flex:1;min-width:0"><b>${esc(x.title)}</b><div class="small muted">${esc(x.time_text||'')}${x.time_text?' · ':''}${esc(coName(x.company_id))}</div></div></div>`}
function linkCard(x){return `<a class="qlink" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><div class="ic" style="${x.company_id?`background:${coColor(x.company_id)}1a;color:${coColor(x.company_id)}`:''}">${ic(x.kind==='app'?'app':'file')}</div><div style="min-width:0"><b>${esc(x.title)}</b><small>${esc(x.note||coName(x.company_id))}</small></div></a>`}
function stTag(s){return `<span class="tag ${s}">${esc(t('st_'+s))}</span>`}

/* ---------- ANNOUNCEMENTS ---------- */
async function vNews(v){
  const{data,error}=await SB.from('itn_posts').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(200);
  if(error)return fail(error);if(VIEW!=='news')return;
  const rows=(data||[]).filter(x=>inScope(x.company_id));
  v.innerHTML=`<div class="row" style="margin-bottom:16px"><div class="sp"></div>${canCreate()?`<button class="btn" id="nNew">${ic('plus')}${t('newPost')}</button>`:''}</div>
  <div class="card list">${rows.length?rows.map(x=>`<div class="it post">${avatar(x.author_email)}<div style="flex:1;min-width:0">
    <div class="row" style="gap:8px">${x.pinned?`<span class="tag pin">📌</span>`:''}<h4>${esc(pTitle(x))}</h4><div class="sp"></div>${coTag(x.company_id)}</div>
    <div class="meta">${esc(nameOf(x.author_email))} · ${esc(fmtDT(x.created_at))}</div>
    <div class="txt">${linkify(pBody(x))}</div>${trNote(x,x.author_email===ME.email)}
    ${canManage(x.company_id)?`<div class="row" style="margin-top:10px;gap:6px"><button class="btn sec sm" data-e="${x.id}">${t('edit')}</button><button class="btn danger sm" data-d="${x.id}">${t('del')}</button></div>`:''}
  </div></div>`).join(''):`<div class="empty">${t('noNews')}</div>`}</div>`;
  if($('#nNew'))$('#nNew').onclick=()=>postModal();
  bindTr(v,render);
  v.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>postModal(rows.find(r=>r.id===b.dataset.e)));
  v.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(!confirm(t('confirmDel')))return;const{error}=await SB.from('itn_posts').delete().eq('id',b.dataset.d);if(error)return fail(error);toast(t('deleted'));render()});
}
function postModal(x){
  modal(x?t('edit'):t('newPost'),`
    <div class="fld"><label>${t('audience')}</label><select class="inp" name="co">${coOptions(x?x.company_id:SCOPE,true)}</select></div>
    <div class="fld"><label>${t('title')}</label><input class="inp" name="title" required maxlength="200" value="${esc(x?x.title:'')}"></div>
    <div class="fld"><label>${t('body')}</label><textarea class="inp" name="body" rows="7">${esc(x?x.body:'')}</textarea></div>
    <label class="chk"><input type="checkbox" name="pin" ${x&&x.pinned?'checked':''}>${t('pinned')}</label>`,
  async bg=>{const f=bg.querySelector('form');const row={company_id:f.co.value||null,title:f.title.value.trim(),body:f.body.value,pinned:f.pin.checked,updated_at:new Date().toISOString()};
    const{error}=x?await SB.from('itn_posts').update(row).eq('id',x.id):await SB.from('itn_posts').insert(row);
    if(error)throw error;toast(t('saved'));render()});
}

function personCard(m){return `<div class="card pc">${avatar(m.email,'lg')}<b>${esc(m.name||m.email)}</b><div class="t">${esc(m.title||'')}</div>

async function vCal(v){
  if(!CAL_M){const n=new Date();CAL_M=new Date(n.getFullYear(),n.getMonth(),1)}
  const start=new Date(CAL_M);start.setDate(1-start.getDay());
  const end=new Date(start);end.setDate(start.getDate()+41);
  const{data,error}=await SB.from('itn_events').select('*').lte('starts_on',ymd(end)).order('starts_on');
  if(error)return fail(error);if(VIEW!=='calendar')return;
  const evs=(data||[]).filter(x=>inScope(x.company_id)&&(x.ends_on||x.starts_on)>=ymd(start));
  const today=ymd(new Date());let cells='';
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=ymd(d);
    const de=evs.filter(x=>x.starts_on<=k&&(x.ends_on||x.starts_on)>=k);

  v.innerHTML=`<div class="grid g3"><div class="card s2"><div class="hd"><button class="btn sec sm" id="cPrev" aria-label="${t('prev')}">‹</button><h3>${esc(CAL_M.toLocaleDateString(LOC(),{year:'numeric',month:'long'}))}</h3><button class="btn sec sm" id="cNext" aria-label="${t('next')}">›</button><button class="btn ghost sm" id="cToday">${t('today')}</button><div class="sp"></div>${canCreate()?`<button class="btn sm" id="cNew">${ic('plus')}${t('newEvent')}</button>`:''}</div>

  $('#cNext').onclick=()=>{CAL_M=new Date(CAL_M.getFullYear(),CAL_M.getMonth()+1,1);render()};

/* ---------- TIME CLOCK ---------- */
let TC_TAB='mine',TC_WEEK=null,TC_TIMER=null,TC_BUSY=false;
const HR=36e5;
const entEnd=e=>e.clock_out?new Date(e.clock_out):new Date();
const entHrs=e=>Math.max(0,(entEnd(e)-new Date(e.clock_in))/HR);
const fmtH=h=>h<0.005?'0:00':`${Math.floor(h)}:${String(Math.round((h%1)*60)).padStart(2,'0')}`.replace(/:60$/,':00');
const fmtHd=h=>(Math.round(h*100)/100).toFixed(2);
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function tcState(rows){
  const open=rows.find(e=>!e.clock_out);
  if(open)return{s:'working',since:open.clock_in,open};
  const last=rows[0];
  if(last&&last.out_reason==='break'&&ymd(new Date(last.clock_out))===ymd(new Date()))return{s:'break',since:last.clock_out};
  return{s:'off'};
}
function getLoc(){return new Promise(res=>{if(!navigator.geolocation)return res(null);
  let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),5000);
  navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>fin(null),{enableHighAccuracy:true,timeout:4500,maximumAge:60000})})}
async function punch(action){
  if(TC_BUSY)return;TC_BUSY=true;$$('.tcbtn').forEach(b=>b.disabled=true);
  try{
    const loc=await getLoc();
    const{error}=await SB.rpc('itn_clock',{action,lat:loc?loc.lat:null,lng:loc?loc.lng:null,acc:loc?loc.acc:null});
    if(error){const k=(error.message||'').match(/already_in|not_in/);throw new Error(k?t('tc_err_'+k[0]):error.message)}
    toast(t({in:'tc_done',out:'tc_doneOut',break:'tc_doneBreak',back:'tc_doneBack'}[action]));
  }catch(e){fail(e)}finally{TC_BUSY=false;render()}
}
function shiftLine(e,canEdit,solo){
  const inT=fmtT(e.clock_in),outT=e.clock_out?fmtT(e.clock_out):'—';
  const miss=!e.clock_out&&entHrs(e)>12;
  const loc=e.in_lat!=null?`<a href="https://maps.google.com/?q=${e.in_lat},${e.in_lng}" target="_blank" rel="noopener" title="${esc(t('tc_loc'))}">📍</a>`:'';
  return `<div class="row" style="gap:8px;padding:4px 0;flex-wrap:nowrap"><span style="font-variant-numeric:tabular-nums;white-space:nowrap">${esc(inT)} – ${esc(outT)}</span>
    ${e.out_reason==='break'?`<span class="tag">${esc(t('tc_breakNote'))}</span>`:''}${miss?`<span class="tag rejected">${esc(t('tc_missing'))}</span>`:''}
    ${e.edited_by?`<span class="tag pending" title="${esc(e.edit_reason||'')}">${esc(t('tc_edited'))} ${esc(t('tc_by'))} ${esc(nameOf(e.edited_by))}</span>`:''}${loc}
    <span class="sp"></span>${solo?'':`<b style="font-variant-numeric:tabular-nums">${fmtH(entHrs(e))}</b>`}${canEdit?`<button class="btn ghost sm" data-te="${e.id}">${t('edit')}</button>`:''}</div>`;
}
function groupByDay(rows){const g={};rows.forEach(e=>{const k=ymd(new Date(e.clock_in));(g[k]=g[k]||[]).push(e)});
  Object.values(g).forEach(a=>a.sort((x,y)=>new Date(x.clock_in)-new Date(y.clock_in)));return g}

     <div class="row"><span class="tag" style="background:${pill[0]};color:${pill[1]};font-size:13px;padding:5px 12px"><span class="dot" style="background:${pill[1]}"></span>${esc(pill[2])}</span>
       ${st.since?`<span class="small muted">${esc(t('tc_since')(fmtT(st.since)))}</span>`:''}</div>
     <div><div id="tcClock" style="font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1"></div>
       <div class="muted" style="margin-top:6px">${esc(new Date().toLocaleDateString(LOC(),{weekday:'long',month:'long',day:'numeric'}))}</div></div>
     <div class="row" style="gap:10px;flex-wrap:nowrap">${btns.replace('class="btn ok tcbtn"','class="btn ok tcbtn" data-p="in"')}</div>
     <div class="row" style="border-top:1px solid var(--line);padding-top:16px"><div><div class="small muted">${t('tc_today')}</div><div id="tcToday" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums">${fmtH(todayH)}</div></div>
       <div class="sp"></div><div style="text-align:right"><div class="small muted">${t('tc_week')}</div><div style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;${weekH>40?'color:var(--bad)':''}">${fmtH(weekH)}</div></div></div>
   </div>
   <div class="card s2"><div class="hd"><h3>${t('tc_thisWeek')}</h3><div class="sp"></div><span class="small muted">${esc(fmtD(ws))} – ${esc(fmtD(addDays(ws,6)))}</span></div>
     <div class="bd"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px">

async function openCh(id,keep){
  CUR_CH=id;const c=CHANNELS.find(x=>x.id===id);if(!c){CUR_CH=null;return render()}
  $('#chat').classList.add('sel');renderChList();
  const canPost=c.kind!=='all'||isOwner()||isMgr();
  const sub=c.kind==='dm'?t('dmWith'):c.kind==='all'?t('allCos'):t('members_n')(MEMBERS.filter(m=>m.active&&m.company_id===c.company_id).length);
  $('#chMain').innerHTML=`<div class="hd"><button class="btn ghost sm back" id="chBack">${ic('back')}</button>${chIcon(c)}<div><b>${esc(chLabel(c))}</b><div class="small muted">${esc(sub)}</div></div></div>
    <div class="phi">⚠️ ${esc(t('phi'))}</div>
    <div class="msgs" id="msgs"><div class="empty">…</div></div>
    ${canPost?`<div class="pend hidden" id="pend"></div><form class="comp" id="comp"><button type="button" class="att" id="attBtn" title="${t('attach')}">${ic('clip')}</button><textarea id="mIn" rows="1" placeholder="${esc(t('typeMsg'))}" maxlength="4000"></textarea><button class="btn send" id="sendBtn">${ic('send')}</button></form>`:`<div class="ro">${esc(t('annOnly'))}</div>`}`;
  $('#chBack').onclick=()=>{CUR_CH=null;$('#chat').classList.remove('sel');renderChList()};
  if(canPost){
    const ta=$('#mIn');
    ta.oninput=()=>{ta.style.height='42px';ta.style.height=Math.min(ta.scrollHeight,160)+'px'};
    ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}};
    $('#comp').onsubmit=e=>{e.preventDefault();sendMsg()};
    $('#attBtn').onclick=()=>$('#fileIn').click();
    if(!keep)ta.focus();
  }
  const{data,error}=await SB.from('itn_messages').select('*').eq('channel_id',id).order('created_at',{ascending:false}).limit(200);
  if(error)return fail(error);if(CUR_CH!==id)return;
  MSGS=(data||[]).reverse();drawMsgs(true);markRead(id);
}
$('#fileIn').onchange=()=>{const f=$('#fileIn').files[0];$('#fileIn').value='';if(!f)return;if(f.size>25*1024*1024)return toast(t('fileBig'));
  PEND_FILE=f;const p=$('#pend');if(p){p.classList.remove('hidden');p.innerHTML=`📎 ${esc(f.name)} <button class="linkbtn" id="pX">✕</button>`;$('#pX').onclick=()=>{PEND_FILE=null;p.classList.add('hidden')}}};
function dayLabel(d){const x=new Date(d),n=new Date();const k=ymd(x);if(k===ymd(n))return t('today');const y=new Date(n);y.setDate(n.getDate()-1);if(k===ymd(y))return t('yesterday');return x.toLocaleDateString(LOC(),{weekday:'long',month:'long',day:'numeric'})}
function drawMsgs(toBottom){
  const box=$('#msgs');if(!box)return;const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  let h='',lastDay='',last=null;
  MSGS.forEach(m=>{const day=ymd(new Date(m.created_at));if(day!==lastDay){h+=`<div class="dsep"><span>${esc(dayLabel(m.created_at))}</span></div>`;lastDay=day;last=null}
    const cont=last&&last.sender_email===m.sender_email&&(new Date(m.created_at)-new Date(last.created_at))<5*60e3;
    const isImg=m.file_name&&/\.(png|jpe?g|gif|webp|heic)$/i.test(m.file_name);
    h+=`<div class="msg ${cont?'cont':''}" data-id="${m.id}">${avatar(m.sender_email)}<div class="bx">${cont?'':`<div class="who">${esc(nameOf(m.sender_email))}<small>${esc(fmtT(m.created_at))}</small></div>`}
      ${m.body?`<div class="tx">${linkify(useTr(m,m.sender_email===ME.email)?m.body_tr:m.body)}</div>${trNote(m,m.sender_email===ME.email)}`:''}
      ${m.file_path?(isImg?`<img class="imgp" data-img="${esc(m.file_path)}" alt="${esc(m.file_name)}">`:`<div class="file" data-f="${esc(m.file_path)}" data-n="${esc(m.file_name)}">${ic('file')}<span>${esc(m.file_name)}</span></div>`):''}</div>
      ${m.sender_email===ME.email||isOwner()?`<button class="del" data-del="${m.id}">${t('del')}</button>`:''}</div>`;last=m});
  box.innerHTML=h||`<div class="empty">${ic('chat','style="width:36px;height:36px;opacity:.3"')}</div>`;
  bindTr(box,()=>drawMsgs());
  box.querySelectorAll('[data-f]').forEach(d=>d.onclick=async()=>{const{data,error}=await SB.storage.from('itn-files').createSignedUrl(d.dataset.f,300,{download:d.dataset.n});if(error)return fail(error);location.href=data.signedUrl});
  box.querySelectorAll('[data-img]').forEach(async im=>{const{data}=await SB.storage.from('itn-files').createSignedUrl(im.dataset.img,3600);if(data){im.src=data.signedUrl;im.onclick=()=>window.open(data.signedUrl,'_blank','noopener')}});
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm(t('deleteMsg')))return;const{error}=await SB.from('itn_messages').delete().eq('id',b.dataset.del);if(error)return fail(error);MSGS=MSGS.filter(x=>x.id!==b.dataset.del);drawMsgs()});
  if(toBottom||atBottom)box.scrollTop=box.scrollHeight;
}
let SENDING=false;
async function sendMsg(){
  if(SENDING)return;const ta=$('#mIn');const body=ta.value.trim();if(!body&&!PEND_FILE)return;
  SENDING=true;$('#sendBtn').disabled=true;const ch=CUR_CH;
  try{
    let file_path=null,file_name=null;
    if(PEND_FILE){const f=PEND_FILE;$('#pend').textContent=t('uploading');
      file_name=f.name;file_path=`${ch}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]+/g,'_').slice(-80)}`;
      const{error}=await SB.storage.from('itn-files').upload(file_path,f,{contentType:f.type||'application/octet-stream'});if(error)throw error}
    const{data,error}=await SB.from('itn_messages').insert({channel_id:ch,body,file_path,file_name}).select().single();if(error)throw error;
    ta.value='';ta.style.height='42px';PEND_FILE=null;const p=$('#pend');if(p)p.classList.add('hidden');
    if(CUR_CH===ch&&!MSGS.some(m=>m.id===data.id)){MSGS.push(data);drawMsgs(true)}
    markRead(ch);
  }catch(e){fail(e)}finally{SENDING=false;const b=$('#sendBtn');if(b)b.disabled=false}
}
async function markRead(ch){UNREAD[ch]=0;renderNav();renderChList();await SB.from('itn_reads').upsert({channel_id:ch,email:ME.email,last_read_at:new Date().toISOString()})}

function subscribe(){
  RT=SB.channel('itn-msgs').on('postgres_changes',{event:'*',schema:'public',table:'itn_messages'},async p=>{
    if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(id&&MSGS.some(m=>m.id===id)){MSGS=MSGS.filter(m=>m.id!==id);drawMsgs()}return}
    if(p.eventType==='UPDATE'){ /* translation arrived */
      const u=p.new;const i=MSGS.findIndex(x=>x.id===u.id);if(i>=0){MSGS[i]={...MSGS[i],...u};drawMsgs()}return}
    if(p.eventType!=='INSERT')return;
    const m=p.new;
    if(!CHANNELS.some(c=>c.id===m.channel_id)){const{data}=await SB.from('itn_channels').select('*').eq('id',m.channel_id).maybeSingle();if(!data)return;CHANNELS.push(data)}
    const viewing=VIEW==='chat'&&CUR_CH===m.channel_id&&!document.hidden;
    if(VIEW==='chat'&&CUR_CH===m.channel_id){if(!MSGS.some(x=>x.id===m.id)){MSGS.push(m);drawMsgs()}}
    if(m.sender_email===ME.email)return;
    if(viewing){markRead(m.channel_id);return}
    UNREAD[m.channel_id]=(UNREAD[m.channel_id]||0)+1;renderNav();renderChList();
    if(!PUSH_SUB&&'Notification' in window&&Notification.permission==='granted'){ /* with push on, the phone/OS notification comes from the server instead */
      const c=CHANNELS.find(x=>x.id===m.channel_id);
      try{const n=new Notification(`${t('newMsgFrom')}: ${nameOf(m.sender_email)}${c&&c.kind!=='dm'?' · '+chLabel(c):''}`,{body:m.body?m.body.slice(0,120):(m.file_name||''),tag:m.channel_id});
        n.onclick=()=>{window.focus();CUR_CH=m.channel_id;go('chat');n.close()}}catch(e){}}
  }).subscribe();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&VIEW==='chat'&&CUR_CH&&UNREAD[CUR_CH])markRead(CUR_CH)});

/* ---------- push notifications (installable app + Web Push) ---------- */
const VAPID='BE6LhOAHT2-QbyTrTE7_HdCwFOgrPFSoOoA1NEGDzaQtVP3vudH9RcoxXRBE17H6QpM9Brh13jP3SP1sjUjoTz8';
let PUSH_SUB=null,SW_REG=null,INSTALL_EVT=null;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
function b64u(s){const p='='.repeat((4-s.length%4)%4);const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))}
function savePushSub(s){const j=s.toJSON();return SB.from('itn_push_subs').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,lang:LANG,ua:navigator.userAgent.slice(0,200)})}
async function initPush(){
  if('serviceWorker' in navigator){
    try{
      SW_REG=await navigator.serviceWorker.register('/intranet/sw.js',{scope:'/intranet/'});
      if(pushSupported()&&Notification.permission==='granted'){
        PUSH_SUB=await SW_REG.pushManager.getSubscription();
        if(PUSH_SUB){const{error}=await savePushSub(PUSH_SUB);if(error){console.warn(error);PUSH_SUB=null}}
      }
    }catch(e){console.warn('sw',e)}
  }
  renderPush();renderNotif();
}
async function enablePush(){
  if(isIOS()&&!isStandalone())return modal(t('iosT'),`<p style="line-height:1.7;margin:0">${esc(t('iosSteps'))}</p>`);
  if(!pushSupported())return toast(t('pushFail'));
  try{
    if(!SW_REG)SW_REG=await navigator.serviceWorker.register('/intranet/sw.js',{scope:'/intranet/'});
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return toast(t('pushDenied'));
    await navigator.serviceWorker.ready;
    PUSH_SUB=(await SW_REG.pushManager.getSubscription())||(await SW_REG.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)}));
    const{error}=await savePushSub(PUSH_SUB);if(error)throw error;
    toast(t('pushDone'));
  }catch(e){PUSH_SUB=null;toast(t('pushFail')+': '+((e&&e.message)||e))}
  renderPush();renderNotif();
}
async function installApp(){if(!INSTALL_EVT)return;INSTALL_EVT.prompt();try{await INSTALL_EVT.userChoice}catch(e){}INSTALL_EVT=null;renderPush()}
function renderPush(){
  if(!ME)return;
  const can=pushSupported()||isIOS();
  const side=$('#pushSide');
  if(side){
    if(PUSH_SUB)side.innerHTML=`<div class="small" style="color:#7F90A8;display:flex;align-items:center;gap:6px">${ic('bell','style="width:14px;height:14px"')}${esc(t('notifOn'))}</div>`;
    else if(can)side.innerHTML=`<button class="btn sm block" id="pushSideBtn" style="background:var(--gold);color:var(--side)">${ic('bell')}${esc(t('pushBtn'))}</button>`;
    else side.innerHTML='';
    if($('#pushSideBtn'))$('#pushSideBtn').onclick=enablePush;
  }
  const home=$('#pushHome');
  if(home){
    if(PUSH_SUB||!can){home.innerHTML=INSTALL_EVT?`<div class="card" style="margin-top:20px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="sp"><b>Kukpo One</b></div><button class="btn sec" id="instBtn">${t('install')}</button></div>`:''}
    else home.innerHTML=`<div class="card" style="margin-top:20px;padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:#E9D9B4;background:#FFFCF5">
      <div style="width:44px;height:44px;border-radius:12px;background:#0B1A2E;color:var(--gold);display:flex;align-items:center;justify-content:center">${ic('bell')}</div>
      <div style="flex:1;min-width:200px"><b style="font-size:15px">${esc(isIOS()&&!isStandalone()?t('iosT'):t('pushT'))}</b><div class="muted" style="margin-top:2px">${esc(isIOS()&&!isStandalone()?t('iosSteps'):t('pushSub'))}</div></div>
      ${INSTALL_EVT?`<button class="btn sec" id="instBtn">${t('install')}</button>`:''}
      ${isIOS()&&!isStandalone()?'':`<button class="btn" id="pushHomeBtn">${ic('bell')}${esc(t('pushBtn'))}</button>`}</div>`;
    if($('#pushHomeBtn'))$('#pushHomeBtn').onclick=enablePush;
    if($('#instBtn'))$('#instBtn').onclick=installApp;
  }
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;renderPush()});
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{
  if(!e.data||e.data.type!=='open'||!ME)return;
  try{const u=new URL(e.data.url);const ch=u.searchParams.get('ch');const v=u.hash.replace('#','');
    if(ch&&CHANNELS.some(c=>c.id===ch))CUR_CH=ch;if(v&&NAV.some(n=>n.k===v))go(v)}catch(err){}
});

/* ---------- start ---------- */
$('#yr').textContent=new Date().getFullYear();
$('#lgLogo').innerHTML=LOGO;
$('#lgCos').innerHTML=['Kukpo Holdings','Center for Pain','Western Pain Clinic','Mira MRI','All Nations Corona ADHC','Ktown Lawyer'].map(n=>`<span>${n}</span>`).join('');
applyStatic();
SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
boot();
</script>
